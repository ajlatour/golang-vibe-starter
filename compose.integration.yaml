# Overrides for the integration tests in integration/. Use with compose.yaml:
#   docker compose -f compose.yaml -f compose.integration.yaml up -d --build --wait
#   go test -C integration ./... -v
#   docker compose -f compose.yaml -f compose.integration.yaml down

services:
  api:
    # A developer's .env must not change what the tests run against.
    env_file: !reset []
    environment:
      HEADER_GUARD_MODE: enforce
      # Short enough that WireMock's timeout fault (8s) produces a 504 quickly,
      # long enough that its slow fault (2s) still succeeds.
      UPSTREAM_TIMEOUT: 3s
      # JSON, so tests can read the API's log lines.
      LOG_FORMAT: json
      # Flag steps switch a flag and wait until flagd serves it; with no cache
      # the API sees the change at once too, so scenarios needn't wait it out.
      FLAGS_CACHE_TTL: 0s

  flagd:
    volumes:
      # The tests' own copy of the flag definitions, which flag steps edit
      # (and restore) so the real flagd/flags.json is never touched. This
      # replaces the base file's mount of ./flagd at the same path. The suite
      # resets it from flagd/flags.json at the start of every run.
      - ./integration/flagd:/etc/flagd:ro
