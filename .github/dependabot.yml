# Keeps every pinned dependency current: Go modules, the GitHub Actions
# (pinned to commit SHAs, with the version in a comment, which Dependabot
# updates together), and the container images (pinned to digests). Weekly,
# with each kind grouped into one pull request, so updates arrive as a few
# reviewable PRs rather than a stream. The images the build runs elsewhere
# (pandoc, Redocly, the SBOM generator) are listed in tools/images/Dockerfile
# for this; docs/pins_test.go checks no pinned image is written anywhere else.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/integration", "/perf/report", "/tools"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/cmd/api", "/tools/images"]
    schedule:
      interval: weekly
    groups:
      dockerfile:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
