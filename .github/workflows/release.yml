name: Release

# Publishes a release when a version tag is pushed (make release-tag; see
# docs/releasing.md): the API's image for linux/amd64 and linux/arm64 on the
# GitHub Container Registry, tagged vX.Y.Z, X.Y and latest, with an SBOM and
# build provenance attached; and a GitHub release whose notes are the
# version's section of CHANGELOG.md, with the documentation attached: the docs
# site, its Performance history page charting main's performance and CI time
# up to the release, and the records it charts.
#
# Run it by hand (workflow_dispatch) for a dry run: the same checks and build,
# from the branch it's run on, publishing nothing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release (and reading the perf-data branch)
      packages: write # the image
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history, to check the tag is on it.
          fetch-depth: 0

      - name: Check what's being released
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run of $(git rev-parse --short HEAD): building, publishing nothing."
            echo "VERSION=v0.0.0-dryrun" >> "$GITHUB_ENV"
            sh scripts/changelog.sh notes > "$RUNNER_TEMP/notes.md"
            exit 0
          fi
          # Only a tag on main is released: a release is what was reviewed and
          # merged, never a branch.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG is on a commit that isn't on main; release from main (make release-tag)."
            exit 1
          fi
          sh scripts/changelog.sh notes "$TAG" > "$RUNNER_TEMP/notes.md"
          # The spec names the API version it describes; make release-prepare
          # set it, so a mismatch means the tag isn't the latest release.
          spec=$(jq -r .info.version docs/openapi.json)
          if [ "$spec" != "${TAG#v}" ]; then
            echo "$TAG doesn't match docs/openapi.json, which is version $spec; tag the latest release (make release-prepare sets both)."
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum

      # A version bump big enough for what changed in the API since the last
      # release (make release-prepare checked it too).
      - name: API changes since the last release
        if: env.DRY_RUN != 'true'
        run: sh scripts/api-compat.sh release "$TAG"

      # What's tagged passed CI on main; this is a last check of the exact
      # commit being published.
      - name: Checks
        run: make check

      # The docs site as of this release, its Performance history page charted
      # from the perf-data branch, and checked like CI checks the docs.
      - name: Build the documentation
        run: |
          make docs-release
          tar -czf "$RUNNER_TEMP/docs-$VERSION.tar.gz" -C bin docs
          tar -czf "$RUNNER_TEMP/performance-records-$VERSION.tar.gz" -C bin/perf/trends-data .
          {
            echo "Documentation: $(du -h "$RUNNER_TEMP/docs-$VERSION.tar.gz" | cut -f1)," \
              "with the performance history of $(find bin/perf/trends-data/records -name '*.json' | wc -l | tr -d ' ') commits" \
              "and $(find bin/perf/trends-data -path '*/ci/*.json' | wc -l | tr -d ' ') CI runs."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # To run the arm64 image on this amd64 runner, for its smoke test.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # Built once, for both platforms, with the SBOM and provenance, and
      # pushed by digest alone: no tag points at it until it has passed its
      # smoke test, and then the tags point at exactly that digest. A dry
      # run loads each platform's image locally instead, to test the same
      # way, and pushes nothing.
      - name: Build the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          set -- -f cmd/api/Dockerfile \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION"
          docker buildx create --use --name release --driver docker-container > /dev/null
          if [ "$DRY_RUN" = true ]; then
            # The multi-platform build, with the SBOM and provenance, as a
            # release makes it, then each platform's image for its test.
            docker buildx build "$@" --platform linux/amd64,linux/arm64 \
              --sbom="generator=$(sh scripts/image.sh syft)" \
              --provenance=mode=max --output "type=oci,dest=$RUNNER_TEMP/image.tar" .
            for arch in amd64 arm64; do
              docker buildx build "$@" --platform "linux/$arch" --load -t "release-candidate:$arch" .
            done
            echo "IMAGE_AMD64=release-candidate:amd64" >> "$GITHUB_ENV"
            echo "IMAGE_ARM64=release-candidate:arm64" >> "$GITHUB_ENV"
            echo "Built $(du -h "$RUNNER_TEMP/image.tar" | cut -f1) for linux/amd64 and linux/arm64, with SBOM and provenance; pushed nothing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build "$@" --platform linux/amd64,linux/arm64 \
            --sbom="generator=$(sh scripts/image.sh syft)" \
            --provenance=mode=max \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/build.json" .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "IMAGE_AMD64=$image@$digest" >> "$GITHUB_ENV"
          echo "IMAGE_ARM64=$image@$digest" >> "$GITHUB_ENV"

      # The image as it will ship, run on each platform against WireMock and
      # flagd: it starts, says it's this version, serves the basics, and
      # shuts down cleanly (scripts/smoke-image.sh). Nothing is tagged
      # unless both pass.
      - name: Smoke-test the image, linux/amd64
        run: sh scripts/smoke-image.sh "$IMAGE_AMD64" linux/amd64 "$VERSION"

      - name: Smoke-test the image, linux/arm64 (emulated)
        run: sh scripts/smoke-image.sh "$IMAGE_ARM64" linux/arm64 "$VERSION"

      # The version's tags, pointed at the digest that was tested: nothing is
      # rebuilt. Then a check that they name exactly that image, with its
      # SBOM and provenance.
      - name: Publish the tested image
        if: env.DRY_RUN != 'true'
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          number=${VERSION#v}
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:${number%.*}" -t "$image:latest" "$image@$IMAGE_DIGEST"
          for tag in "$VERSION" "${number%.*}" latest; do
            got=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$IMAGE_DIGEST" ]; then
              echo "$image:$tag is $got, not the tested $IMAGE_DIGEST"
              exit 1
            fi
          done
          # Each platform's SBOM (SPDX) and provenance (SLSA) came along.
          for what in SBOM:SPDX Provenance:SLSA; do
            if ! docker buildx imagetools inspect "$image:$VERSION" --format "{{json .${what%%:*}}}" | grep -q "\"${what#*:}\""; then
              echo "$image:$VERSION has no ${what%%:*}"
              exit 1
            fi
          done
          {
            echo "## $VERSION"
            echo
            echo "Image: \`$image:$VERSION\` (also \`${number%.*}\` and \`latest\`), for linux/amd64 and linux/arm64, smoke-tested on both: \`$IMAGE_DIGEST\`."
            echo
            echo '```'
            docker buildx imagetools inspect "$image:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "Image: \`$image:$VERSION\`, for linux/amd64 and linux/arm64, with an SBOM and build provenance."
            echo
            echo "Documentation: \`docs-$VERSION.tar.gz\`, the docs site as of this release; open \`docs/index.html\`."
            echo "Its Performance history page charts \`main\`'s performance and CI time up to the release, from the"
            echo "records in \`performance-records-$VERSION.tar.gz\`."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/release.md"
          gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release.md" --verify-tag \
            "$RUNNER_TEMP/docs-$VERSION.tar.gz" "$RUNNER_TEMP/performance-records-$VERSION.tar.gz"
