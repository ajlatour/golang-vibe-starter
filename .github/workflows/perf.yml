name: Performance

# Compares each pull request's performance with its base branch and keeps the
# result in a single comment on the pull request, edited on every push. See
# docs/performance.md#pull-request-reports.
#
# Two comparisons run in parallel, each on one runner with the base and the
# pull request interleaved (base, PR, PR, base, ...), so the runner's ups and
# downs land on both alike: the Go benchmarks, and a short k6 load test. A
# third job writes the report from their results, and a fourth, the only one
# that can write to the pull request, posts it without running any of the
# pull request's code. It fails only on what is
# exact or plainly broken: more allocations per operation on a benchmarked
# path (unless the pull request has the perf-ok label), or the load test
# crossing its thresholds. Timing changes are reported, never failed on.

on:
  pull_request:
    # labeled and unlabeled so adding or removing perf-ok re-evaluates.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # Prose can't change performance.
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

# A newer push to the pull request cancels the comparison in progress. A label
# change other than perf-ok gets a group of its own: it skips every job, and
# sharing the group would only cancel the real comparison (Dependabot, for
# one, adds labels the moment it opens a pull request).
concurrency:
  group: >-
    perf-${{ github.event.pull_request.number }}-${{
    ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'perf-ok')
    && github.run_id || 'compare' }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.base_ref }}
  VERSION: ${{ github.sha }}

jobs:
  bench:
    # Other labels don't change anything, so they don't rerun the comparison.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'perf-ok'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch's history, for the base's worktree.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: perf/report/go.sum

      - name: Benchmarks, interleaved with the base
        run: sh perf/bench-ab.sh "origin/$BASE_REF" 10 bin/bench

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench
          path: |
            bin/bench/base.txt
            bin/bench/head.txt

  load:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'perf-ok'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Go's build cache from earlier runs, so the image build recompiles only
      # what changed (scripts/build-api-image.sh). Keyed on the Dockerfile
      # (its Go version) and go.mod; pull requests read main's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-gobuild
          key: docker-gobuild-${{ hashFiles('cmd/api/Dockerfile', 'go.mod') }}-${{ github.run_id }}
          restore-keys: docker-gobuild-${{ hashFiles('cmd/api/Dockerfile', 'go.mod') }}-

      - name: Load test, interleaved with the base
        env:
          GOCACHE_DIR: ${{ runner.temp }}/docker-gobuild
        run: |
          status=0
          sh perf/load-ab.sh "origin/$BASE_REF" 2 bin/perf/compare compare || status=$?
          # The report job turns crossed thresholds into the verdict.
          if [ "$status" -ne 0 ]; then touch bin/perf/compare/head-failed; fi

      - name: Logs from the stack
        if: failure() || hashFiles('bin/perf/compare/head-failed') != ''
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load
          path: bin/perf/compare/

  # Writes the report from the measurements, still read-only: it builds and
  # runs the report tool from the pull request's own code, so it must not be
  # able to write anywhere. It hands the finished comment and its verdict to
  # the comment job.
  report:
    needs: [bench, load]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            perf/report/go.sum
            tools/go.sum

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - name: Write the report
        env:
          ACCEPT_ALLOCS: ${{ contains(github.event.pull_request.labels.*.name, 'perf-ok') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/docs/performance.md#pull-request-reports
        run: |
          set -- -base-name "$BASE_REF" -details-url "$RUN_URL" -docs-url "$DOCS_URL" \
            -bench-base results/bench/base.txt -bench-head results/bench/head.txt \
            -load results/load
          [ -e results/load/head-failed ] && set -- "$@" -load-failed
          [ "$ACCEPT_ALLOCS" = true ] && set -- "$@" -accept-allocs
          # Built and then run, not go run, which turns every failure into
          # exit status 1 and so would hide which kind this is.
          go build -C perf/report -o "$RUNNER_TEMP/report" .
          mkdir -p verdict
          status=0
          "$RUNNER_TEMP/report" "$@" > verdict/report.md || status=$?
          # 1 is a blocking regression, which the comment job fails on;
          # anything else is a broken input, which fails here.
          [ "$status" -le 1 ] || exit "$status"
          if [ "$status" -eq 1 ]; then echo blocking; else echo ok; fi > verdict/verdict

      - name: Write the job summary
        run: |
          {
            cat verdict/report.md
            echo
            echo '<details><summary>benchstat</summary>'
            echo
            echo '```'
            go -C tools build -o "$RUNNER_TEMP/" golang.org/x/perf/cmd/benchstat
            "$RUNNER_TEMP/benchstat" "$BASE_REF=results/bench/base.txt" PR=results/bench/head.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdict
          path: verdict/

  # Posts the report and applies its verdict. The only job that can write to
  # the pull request, and it never checks out or runs the pull request's code:
  # it reads the report job's two files, as data, and calls GitHub's API.
  comment:
    needs: [report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verdict
          path: verdict

      # A pull request from a fork gets a read-only token, so its report is in
      # the report job's summary only.
      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- perf-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@verdict/report.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@verdict/report.md > /dev/null
          fi

      - name: Fail on a blocking regression
        run: |
          if [ "$(cat verdict/verdict)" = blocking ]; then
            echo "Blocking performance regression: see the report on the pull request or in the report job's summary."
            exit 1
          fi
