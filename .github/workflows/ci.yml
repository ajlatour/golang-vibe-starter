name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the unit tests: fast, and no Docker.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The service has no dependencies, so the integration and perf
          # report modules' go.sum files are the ones to key the cache on.
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum

      # The same targets as `make check`, as separate steps so a failure
      # shows which one.
      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      # The unit tests, with the race detector, and the coverage they give
      # across packages: a table of it in the job summary, failing under
      # the floor (COVER_MIN in the Makefile).
      - name: Unit tests and coverage
        run: make cover

  # The Godog feature tests against the whole stack, started with docker
  # compose here. The tests themselves only talk HTTP to it.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Stamped into the API's log lines as its version.
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      # Go's build cache from earlier runs, so the image build recompiles only
      # what changed (scripts/build-api-image.sh). Keyed on the Dockerfile
      # (its Go version) and go.mod; pull requests read main's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/docker-gobuild
          key: docker-gobuild-${{ hashFiles('cmd/api/Dockerfile', 'go.mod') }}-${{ github.run_id }}
          restore-keys: docker-gobuild-${{ hashFiles('cmd/api/Dockerfile', 'go.mod') }}-

      - name: Build the API image
        env:
          GOCACHE_DIR: ${{ runner.temp }}/docker-gobuild
        run: sh scripts/build-api-image.sh golang-vibe-starter-api

      # `make integration` in steps, so the logs and teardown run as their
      # own steps whatever happens.
      - name: Start the stack
        run: make integration-up BUILD=--no-build

      - name: Integration tests
        run: make integration-test

      - name: Logs from the stack
        if: failure()
        run: make integration-logs

      - name: Stop the stack
        if: always()
        run: make integration-down

  # Builds the documentation website (pandoc and Redocly, in Docker) and
  # checks that every page exists and every link in it resolves.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: integration/go.sum

      - name: Build and check the docs site
        run: make docs-check

      # What changed in the API since the last release: a breaking change
      # needs a **Breaking** changelog entry, for the release notes.
      - name: API changes since the last release
        run: |
          git fetch -q --tags --unshallow origin 2>/dev/null || git fetch -q --tags origin
          sh scripts/api-compat.sh pr

  # Known vulnerabilities in the code's dependencies and the Go standard
  # library, for all three modules. govulncheck reports only those the code
  # can actually reach.
  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum
            tools/go.sum

      - name: govulncheck
        run: make vuln

  # A short fuzzing run of the code that handles untrusted input (make fuzz).
  # Each target's seeds already run as tests in the test job; this explores
  # beyond them. A failing input is uploaded, to reproduce with go test.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: integration/go.sum

      - name: Fuzz
        run: make fuzz FUZZTIME=10s

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure
          path: internal/**/testdata/fuzz/

  # Static analysis on all three modules (make lint): staticcheck for bugs and
  # suspicious code, gosec for security mistakes. CodeQL would need GitHub
  # Advanced Security on a private repository (docs/decisions.md, ADR-0026).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum
            tools/go.sum

      - name: Static analysis
        run: make lint
