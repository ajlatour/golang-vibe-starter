name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the unit tests: fast, and no Docker.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The service has no dependencies, so the integration module's
          # go.sum is the only one to key the cache on.
          cache-dependency-path: integration/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -C integration ./...

      - name: Unit tests
        run: go test -race ./...

  # The Godog feature tests against the whole stack, started with docker
  # compose here. The tests themselves only talk HTTP to it.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE: docker compose -f compose.yaml -f compose.integration.yaml
      # Stamped into the API's log lines as its version.
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      - name: Start the stack
        run: $COMPOSE up -d --build --wait

      - name: Integration tests
        run: go test -C integration ./... -v -count=1

      - name: Logs from the stack
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down
