name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, vet and the unit tests: fast, and no Docker.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The service has no dependencies, so the integration and perf
          # report modules' go.sum files are the ones to key the cache on.
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum

      # The same targets as `make check`, as separate steps so a failure
      # shows which one.
      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: Unit tests
        run: make test-race

  # The Godog feature tests against the whole stack, started with docker
  # compose here. The tests themselves only talk HTTP to it.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stamped into the API's log lines as its version.
      VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum

      # `make integration` in steps, so the logs and teardown run as their
      # own steps whatever happens.
      - name: Start the stack
        run: make integration-up

      - name: Integration tests
        run: make integration-test

      - name: Logs from the stack
        if: failure()
        run: make integration-logs

      - name: Stop the stack
        if: always()
        run: make integration-down

  # Builds the documentation website (pandoc and Redocly, in Docker) and
  # checks that every page exists and every link in it resolves.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: integration/go.sum

      - name: Build and check the docs site
        run: make docs-check

  # Known vulnerabilities in the code's dependencies and the Go standard
  # library, for all three modules. govulncheck reports only those the code
  # can actually reach.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            integration/go.sum
            perf/report/go.sum

      - name: govulncheck
        run: make vuln
