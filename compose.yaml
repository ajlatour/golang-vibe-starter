# Local development stack: the API, WireMock as its mock upstream, and flagd
# as the OpenFeature sidecar.
#   docker compose up --build
#   API: http://localhost:8080   WireMock: http://localhost:8081 (admin: /__admin)
#   flagd (OpenFeature): http://localhost:8016 (OFREP)

name: golang-vibe-starter

services:
  api:
    # The image `up --build` builds, or with --no-build, an image built
    # elsewhere: perf/load-ab.sh runs two versions of the API this way.
    image: ${API_IMAGE:-golang-vibe-starter-api}
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
      args:
        # Shown as "version" in every log line, e.g.
        #   VERSION=$(git rev-parse --short HEAD) docker compose up --build
        VERSION: ${VERSION:-devel}
    ports:
      # Published on this machine's loopback only, like every port here: on a
      # shared network, nobody else can reach the stack, least of all
      # WireMock's unauthenticated admin API.
      - "127.0.0.1:8080:8080"
      # The runtime profiles (pprof), published on this machine's loopback
      # only: they expose the program's internals. docs/performance.md.
      - "127.0.0.1:6061:6061"
    # Your settings, if you've copied .env.example to .env and uncommented
    # some. The environment block below wins over this file.
    env_file:
      - path: .env
        required: false
    environment:
      # These two wire the API to the containers below, and always apply.
      UPSTREAM_URL: http://mock:8080
      # flagd's OFREP endpoint. Remove this to run with every flag at its default.
      FLAGS_URL: http://flagd:8016
      # The request-validation service, stubbed by WireMock
      # (wiremock/mappings/validator.json): it allows every request but
      # /items/refused-by-validator. Remove this to run without the check.
      VALIDATOR_URL: http://mock:8080
      # These can be changed in .env or the shell, e.g.
      #   HEADER_GUARD_MODE=report make up
      UPSTREAM_TIMEOUT: ${UPSTREAM_TIMEOUT:-5s}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      HEADER_GUARD_MODE: ${HEADER_GUARD_MODE:-enforce}
      # API keys (docs/curl.md#api-keys): by default two local development
      # keys, gvs_local-development-only, which may write, and
      # gvs_local-read-only, which may only read. They're in this file, so
      # they're no secret: they work only because the stack is published on
      # loopback. Set API_KEYS in .env (make api-key) to use your own.
      # Per-client rate limit: off locally, so the load tests in perf/ measure
      # the API rather than the limiter. Set RATE_LIMIT in .env to try it.
      RATE_LIMIT: ${RATE_LIMIT:-0}
      API_KEYS: ${API_KEYS:-dev:write:1f0d1e72ef1251a015cbec8ae3ad6880002ffe8ad4de82f4f496db34dc3e91dc,dev-reader:read:1cf20667ccf4aa0982ca024c319ee0cf77cadf20e85bd2fc51264075af57b2d4}
      # All interfaces inside the container, so the port above can reach it.
      PPROF_ADDR: 0.0.0.0:6061
    depends_on:
      mock:
        condition: service_healthy
      # Started, not healthy: flagd is optional. If it's down, flag evaluation
      # falls back to defaults rather than failing requests.
      flagd:
        condition: service_started
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Longer than the default SHUTDOWN_TIMEOUT (10s) so in-flight requests
    # can drain before Docker sends SIGKILL.
    stop_grace_period: 15s
    # Least privilege: the API writes nothing to disk, needs no Linux
    # capabilities, and can't gain privileges (setuid binaries, for one), so
    # a compromised process has as little as possible to work with. The image
    # already runs as a non-root user.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  mock:
    # Multi-arch: runs natively on arm64 and amd64. The -alpine tag is
    # amd64-only and would run emulated on Apple Silicon, skewing timings.
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Happy-path stubs only. Fault stubs in wiremock/faults are added at
      # runtime through the admin API; see docs/local-stack.md.
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    environment:
      # Fixed heap: no resize pauses mid-run, and a predictable footprint.
      JAVA_OPTS: -Xms512m -Xmx512m
    command:
      # Tuned for long-running load tests (see docs/local-stack.md):
      - --no-request-journal # don't record every request in memory (unbounded heap growth)
      - --disable-request-logging # no per-request log lines
      - --async-response-enabled=true # delayed responses don't hold Jetty threads
      - --async-response-threads=32
      - --container-threads=200 # Jetty request thread pool, raised for concurrency
      - --disable-gzip # skip compression CPU on both sides of a local hop
      - --disable-banner
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 15s

  flagd:
    # OpenFeature sidecar. The API evaluates flags over OFREP (HTTP, port
    # 8016); no OpenFeature SDK or gRPC dependency is needed.
    image: ghcr.io/open-feature/flagd:v0.17.0@sha256:c9f21380dfe51d3ad662a116bc350c7692dead7a8d1e640aa0f6b40cd3d966df
    ports:
      - "127.0.0.1:8016:8016"
    volumes:
      # The directory is mounted, not the file, so an editor that saves by
      # replacing the file still works. flagd watches the file and reloads on
      # change, but it can lose its watch if a replaced file isn't visible yet
      # when it re-attaches (it then stops reloading until restarted), so tools
      # should edit the file in place; integration/flags_test.go explains.
      - ./flagd:/etc/flagd:ro
    command:
      - start
      - --uri
      - file:/etc/flagd/flags.json
    stop_grace_period: 5s

  k6:
    # The load generator for the performance tests in perf/. Not started by
    # `up`: `make perf PROFILE=<name>` runs it on demand (the perf profile),
    # on this network, so it reaches the API container directly.
    image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
    profiles: [perf]
    volumes:
      - ./perf:/perf:ro
      - ./bin/perf:/out
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  # The monitoring stack (make monitor; docs/performance.md#watching-resources).
  # Not started by `up`. Every container's CPU and memory from cAdvisor, the
  # API's runtime metrics and k6's results, in Prometheus, on a Grafana
  # dashboard. Published on this machine's loopback only.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    profiles: [monitoring]
    # cAdvisor reads the Docker engine's cgroups, which takes the host's
    # filesystems, read-only, and privileged mode. On macOS, "host" is Docker
    # Desktop's Linux VM, which is what the containers run in.
    privileged: true
    volumes:
      - /:/rootfs:ro
      # Docker's API names the containers; containerd, which Docker Desktop
      # stores images in, has their details.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=2s
      - --store_container_labels=false
      # Leave out the per-process and per-disk detail nobody here reads.
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      # k6 pushes its results (perf/run.sh adds -o experimental-prometheus-rw).
      - --web.enable-remote-write-receiver

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      # Local and loopback-only, so no login: anyone who can reach it is you.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/performance.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    depends_on:
      - prometheus
