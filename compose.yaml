# Local development stack: the API, WireMock as its mock upstream, and flagd
# as the OpenFeature sidecar.
#   docker compose up --build
#   API: http://localhost:8080   WireMock: http://localhost:8081 (admin: /__admin)
#   flagd (OpenFeature): http://localhost:8016 (OFREP)

name: golang-vibe-starter

services:
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
      args:
        # Shown as "version" in every log line, e.g.
        #   VERSION=$(git rev-parse --short HEAD) docker compose up --build
        VERSION: ${VERSION:-devel}
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://mock:8080
      UPSTREAM_TIMEOUT: 5s
      # flagd's OFREP endpoint. Unset this to run with every flag at its default.
      FLAGS_URL: http://flagd:8016
      LOG_FORMAT: text
    depends_on:
      mock:
        condition: service_healthy
      # Started, not healthy: flagd is optional. If it's down, flag evaluation
      # falls back to defaults rather than failing requests.
      flagd:
        condition: service_started
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Longer than the default SHUTDOWN_TIMEOUT (10s) so in-flight requests
    # can drain before Docker sends SIGKILL.
    stop_grace_period: 15s

  mock:
    # Multi-arch: runs natively on arm64 and amd64. The -alpine tag is
    # amd64-only and would run emulated on Apple Silicon, skewing timings.
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      # Happy-path stubs only. Fault stubs in wiremock/faults are added at
      # runtime through the admin API; see docs/local-stack.md.
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    environment:
      # Fixed heap: no resize pauses mid-run, and a predictable footprint.
      JAVA_OPTS: -Xms512m -Xmx512m
    command:
      # Tuned for long-running load tests (see docs/local-stack.md):
      - --no-request-journal # don't record every request in memory (unbounded heap growth)
      - --disable-request-logging # no per-request log lines
      - --async-response-enabled=true # delayed responses don't hold Jetty threads
      - --async-response-threads=32
      - --container-threads=200 # Jetty request thread pool, raised for concurrency
      - --disable-gzip # skip compression CPU on both sides of a local hop
      - --disable-banner
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 15s

  flagd:
    # OpenFeature sidecar. The API evaluates flags over OFREP (HTTP, port
    # 8016); no OpenFeature SDK or gRPC dependency is needed.
    image: ghcr.io/open-feature/flagd:v0.12.9
    ports:
      - "8016:8016"
    volumes:
      # The directory is mounted, not the file, so an editor that saves by
      # replacing the file still works. flagd watches the file and reloads on
      # change, but it can lose its watch if a replaced file isn't visible yet
      # when it re-attaches (it then stops reloading until restarted), so tools
      # should edit the file in place; integration/flags_test.go explains.
      - ./flagd:/etc/flagd:ro
    command:
      - start
      - --uri
      - file:/etc/flagd/flags.json
    stop_grace_period: 5s
